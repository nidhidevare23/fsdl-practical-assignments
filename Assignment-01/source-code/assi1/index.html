<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Text Formatting Tags</title>
</head>

<body bgcolor="#f4f6f8">

<h1 align="center" style="background-color:#4CAF50; color:white; padding:10px;">
    HTML Text Formatting Tags
</h1>

<table align="center" width="60%" border="1" cellpadding="10" cellspacing="0" bordercolor="#999" bgcolor="white">
    <tr bgcolor="#f0f0f0">
        <th>Tag</th>
        <th>Example</th>
    </tr>
    <tr>
        <td align="center">em</td>
        <td align="center"><em>Emphasized text</em></td>
    </tr>
    <tr>
        <td align="center">i</td>
        <td align="center"><i>Italic text</i></td>
    </tr>
    <tr>
        <td align="center">u</td>
        <td align="center"><u>Underlined text</u></td>
    </tr>
    <tr>
        <td align="center">strong</td>
        <td align="center"><strong>Strong text</strong></td>
    </tr>
    <tr>
        <td align="center">small</td>
        <td align="center"><small>Small text</small></td>
    </tr>
    <tr>
        <td align="center">mark</td>
        <td align="center"><mark>Marked text</mark></td>
    </tr>
    <tr>
        <td align="center">del</td>
        <td align="center"><del>Deleted text</del></td>
    </tr>
</table>

</body>
</html>
